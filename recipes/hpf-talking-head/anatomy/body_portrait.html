<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Mont; src: url("file:///root/.fonts/Montserrat-VF.ttf"); font-weight: 100 900; }
@font-face { font-family: Cred; src: url("file:///root/.fonts/BeVietnamPro-Medium.ttf"); }
@font-face { font-family: Kick; src: url("file:///root/.fonts/BeVietnamPro-ExtraBold.ttf"); }
html, body { margin: 0; background: transparent; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="3360" height="1560"></canvas>
<script>window.HOT = undefined;</script>
<script src="prims.js"></script>
<script>
// Portrait cards for office posture: upper trapezius, glute + sciatic nerve, spinal disc, sitting lean. 420x780 logical at 2x.
const PW = 420, S2 = 2;
function pcard(i, kicker) {
  X.save(); X.translate(i * PW * S2, 0); X.scale(S2, S2);
  X.save(); X.shadowColor = "rgba(0,0,0,.35)"; X.shadowBlur = 16; X.shadowOffsetY = 8;
  X.fillStyle = "#fcfcfa"; X.beginPath(); X.roundRect(10, 10, 400, 760, 24); X.fill(); X.restore();
  X.strokeStyle = "#d4d6da"; X.lineWidth = 3; X.beginPath(); X.roundRect(10, 10, 400, 760, 24); X.stroke();
  X.font = "800 19px Mont"; const w = X.measureText(kicker).width;
  X.fillStyle = C.cream; X.beginPath(); X.roundRect(26, 28, w + 28, 38, 7); X.fill();
  X.fillStyle = "#1c1814"; X.textAlign = "left"; X.textBaseline = "middle"; X.fillText(kicker, 40, 48);
  X.font = "13px Cred"; X.fillStyle = C.grey; X.textAlign = "right"; X.fillText("minh hoạ: HPF", 396, 752);
}
const pend = () => X.restore();
const mirror = (pts, cx = 210) => pts.map(p => [2 * cx - p[0], p[1]]);
function nerve(pts, faint) {
  const hot = window.HOT === true;
  X.save(); X.lineCap = "round"; X.lineJoin = "round";
  if (hot) { X.shadowColor = "rgba(255,200,0,1)"; X.shadowBlur = 24; }
  X.strokeStyle = faint ? "rgba(214,160,20,.55)" : (hot ? "#ffd21f" : "#e0a91c"); X.lineWidth = hot ? 11 : 9;
  X.beginPath(); X.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) X.lineTo(pts[i][0], pts[i][1]);
  X.stroke(); X.shadowBlur = 0; X.strokeStyle = "rgba(255,255,255,.55)"; X.lineWidth = 2; X.stroke(); X.restore();
}
function vbox(x, y, w, h, a = 0) { X.save(); X.translate(x, y); X.rotate(a); bone([[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]]); X.restore(); }

function trapBack() {            // neck + shoulders from behind; upper trapezius hot
  skin([[168, 96], [252, 96], [272, 160], [256, 228], [250, 262], [340, 286], [380, 330], [376, 560], [44, 560], [40, 330], [80, 286], [170, 262], [164, 228], [148, 160]]);
  for (let i = 0; i < 9; i++) vbox(210, 238 + i * 34, 26, 22);                                   // cervical + thoracic
  bone([[96, 330], [176, 338], [170, 470], [120, 420]]); bone(mirror([[96, 330], [176, 338], [170, 470], [120, 420]]));  // scapulae
  const upL = [[206, 214], [176, 244], [86, 290], [94, 318], [206, 304]];
  muscle(upL, [206, 214], [206, 304], [86, 290], [94, 318], { n: 40, bow: -8, hot: true });
  muscle(mirror(upL), [214, 214], [214, 304], [334, 290], [326, 318], { n: 40, bow: 8, hot: true });
  const lowL = [[206, 304], [94, 318], [150, 382], [206, 480]];
  muscle(lowL, [206, 304], [206, 480], [94, 318], [150, 382], { n: 30, bow: 6, c0: "#c44a42" });
  muscle(mirror(lowL), [214, 304], [214, 480], [326, 318], [270, 382], { n: 30, bow: -6, c0: "#c44a42" });
  arrow(88, 360, 88, 300, C.red, 5); arrow(332, 360, 332, 300, C.red, 5);                    // shrug: pulled up
}
function gluteBack() {           // pelvis + hips from behind; gluteus max hot, sciatic nerve
  skin([[70, 120], [350, 120], [384, 260], [372, 400], [330, 560], [230, 560], [214, 420], [206, 420], [190, 560], [90, 560], [48, 400], [36, 260]]);
  bone([[90, 150], [180, 140], [200, 230], [160, 280], [96, 240]]); bone(mirror([[90, 150], [180, 140], [200, 230], [160, 280], [96, 240]]));  // ilium
  bone([[186, 160], [234, 160], [226, 280], [210, 300], [194, 280]]);                                                                   // sacrum
  bone([[96, 300], [124, 296], [150, 560], [124, 560]]); bone(mirror([[96, 300], [124, 296], [150, 560], [124, 560]]));               // femurs
  const nL = [[196, 270], [168, 320], [142, 380], [138, 440], [140, 560]];
  nerve(nL, false); nerve(mirror(nL), false);
  const gl = [[200, 230], [140, 214], [70, 300], [84, 400], [176, 420], [204, 320]];
  muscle(gl, [200, 230], [204, 320], [70, 300], [84, 400], { n: 46, bow: 10, hot: true });
  muscle(mirror(gl), [220, 230], [216, 320], [350, 300], [336, 400], { n: 46, bow: -10, hot: true });
  nerve(nL.slice(0, 4), true); nerve(mirror(nL).slice(0, 4), true);                          // seen through the muscle
}
function discPair(y, healthy) {  // two vertebrae + the disc between, side view
  const dx = 150;
  bone([[dx - 70, y - 110], [dx + 70, y - 104], [dx + 70, y - 36], [dx - 70, y - 30]]); bone([[dx + 70, y - 96], [dx + 120, y - 86], [dx + 118, y - 60], [dx + 70, y - 54]]);
  bone([[dx - 70, y + 30], [dx + 70, y + 36], [dx + 70, y + 104], [dx - 70, y + 110]]); bone([[dx + 70, y + 46], [dx + 120, y + 56], [dx + 118, y + 82], [dx + 70, y + 88]]);
  X.save(); X.beginPath();
  if (healthy) { X.ellipse(dx, y, 74, 26, 0, 0, 7); X.fillStyle = "#8ec9e6"; }
  else { X.ellipse(dx, y, 76, 12, 0, 0, 7); X.fillStyle = "#b9bfc4"; }
  X.fill(); X.strokeStyle = healthy ? "#4a8fb0" : "#8a9096"; X.lineWidth = 2; X.stroke(); X.restore();
  if (healthy) { arrow(dx - 108, y - 70, dx - 108, y - 112, C.green, 5); arrow(dx - 108, y + 70, dx - 108, y + 112, C.green, 5); }
}
function leanFront(cx, lean) {   // spine + pelvis from the front; lean = sideways bend
  const n = 8;
  for (let i = 0; i < n; i++) { const u = i / (n - 1); vbox(cx + lean * 40 * Math.sin(Math.PI * u * 0.9), 120 + i * 34, 30, 22, -lean * 0.12 * Math.cos(Math.PI * u)); }
  X.save(); X.translate(cx, 430); X.rotate(lean * 0.16);
  bone([[-78, -40], [-24, -30], [-12, 10], [12, 10], [24, -30], [78, -40], [70, 30], [30, 70], [-30, 70], [-70, 30]]);
  X.restore();
  X.strokeStyle = lean ? C.red : C.green; X.lineWidth = 5; X.setLineDash([10, 8]);
  X.beginPath(); X.moveTo(cx - 80, 430 + (lean ? -14 : 0)); X.lineTo(cx + 80, 430 + (lean ? 14 : 0)); X.stroke(); X.setLineDash([]);
}

window.ready = false;
window.render = function () {
  X.clearRect(0, 0, cv.width, cv.height);
  pcard(0, "CƠ THANG TRÊN (NHÌN TỪ SAU)"); trapBack();
  hand("vai xoay ra trước", 210, 630, C.ink, 30); hand("cơ thang trên co lên", 210, 672, C.red, 34); pend();
  pcard(1, "CƠ MÔNG & DÂY THẦN KINH TOẠ"); gluteBack();
  hand("cơ mông căng", 210, 630, C.red, 34); hand("chèn dây thần kinh toạ", 210, 672, "#b07d00", 30); pend();
  pcard(2, "ĐĨA ĐỆM CỘT SỐNG"); discPair(220, false); discPair(470, true);
  hand("ngồi yên lâu", 330, 200, C.red, 28); hand("ít dinh dưỡng", 330, 236, C.red, 26);
  hand("co / duỗi", 330, 450, C.green, 28); hand("nhận dinh dưỡng", 330, 486, C.green, 26);
  tick(330, 150, false); tick(330, 400, true);
  hand("đĩa đệm cần vận động", 210, 660, C.ink, 30); pend();
  pcard(3, "NGỒI LỆCH (NHÌN TỪ TRƯỚC)"); leanFront(115, 0); leanFront(305, 1);
  labelTick("thẳng", 128, 560, C.green, true, 28); labelTick("nghiêng", 318, 560, C.red, false, 28);
  hand("cột sống nghiêng, chậu lệch", 210, 650, C.red, 28); hand("lâu ngày lệch dần", 210, 692, C.ink, 28); pend();
};
document.fonts.load("700 40px Mont").then(() => document.fonts.load("800 28px Mont")).then(() => document.fonts.ready)
  .catch(() => {}).then(() => { window.render(0); window.ready = true; });
</script></body></html>
