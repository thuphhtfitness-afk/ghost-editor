<script>
window.ready = false;
window.render = function () {
  X.clearRect(0, 0, cv.width, cv.height);
  card(0, 0, "BẮP CHÂN KHI ĐI GIÀY CAO GÓT"); calfHeel(660, 175, 0.68);
  hand("luôn phải kiễng", 250, 280, C.ink, 46); hand("bắp chân căng", 250, 340, C.red, 52);
  X.strokeStyle = C.red; X.lineWidth = 5; X.beginPath(); X.moveTo(400, 330); X.lineTo(700, 270); X.stroke(); end();

  card(CW, 0, "CƠ GẤP HÔNG (HIP FLEXOR)"); seatedHip(760, 200, 0.9);
  hand("ngồi nhiều", 200, 230, C.ink, 46); hand("cơ gấp hông", 200, 290, C.red, 50); hand("bị căng", 200, 345, C.red, 50);
  X.strokeStyle = C.red; X.lineWidth = 5; X.beginPath(); X.moveTo(320, 320); X.lineTo(770, 330); X.stroke(); end();

  card(0, CH, "KHUNG CHẬU (NHÌN NGHIÊNG)"); pelvisTilt(300, 300, 0.95, false, C.green); pelvisTilt(760, 300, 0.95, true, C.red);
  labelTick("trung tính", 300, 560, C.green, true); labelTick("lật ra trước", 770, 560, C.red, false); end();

  card(CW, CH, "LƯNG VÕNG"); lordosis(480, 350, 0.78);
  hand("lưng võng", 830, 250, C.red, 54); hand("cơ lưng gánh", 830, 320, C.ink, 44); hand("quá nhiều", 830, 370, C.ink, 44); hand("→ mỏi lưng", 830, 440, C.red, 46); end();

  card(0, 2 * CH, "CHUỖI GÂY ĐAU LƯNG");
  shoeIcon(170, 300, 1.0); pelvisTilt(520, 300, 0.62, true, C.red); lordosis(850, 320, 0.5);
  arrow(290, 300, 380, 300, C.ink, 6); arrow(640, 300, 730, 300, C.ink, 6);
  hand("giày cao gót", 170, 470, C.ink, 40); hand("+ ngồi nhiều", 170, 520, C.ink, 40);
  hand("chậu lật trước", 520, 495, C.red, 40); hand("lưng võng", 860, 470, C.red, 40); hand("đau mỏi lưng", 860, 520, C.red, 40); end();
};
document.fonts.load("700 40px Mont").then(() => document.fonts.load("800 28px Mont")).then(() => document.fonts.ready)
