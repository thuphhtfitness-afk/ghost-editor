<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Mont; src: url("file:///root/.fonts/Montserrat-VF.ttf"); font-weight: 100 900; }
@font-face { font-family: Cred; src: url("file:///root/.fonts/BeVietnamPro-Medium.ttf"); }

html, body { margin: 0; background: transparent; } canvas { display: block; }

<body><canvas id="c" width="4200" height="1560"></canvas>
<script>window.HOT = undefined;</script>
<script src="prims.js"></script>
<script src="foot_kit.js"></script>
<script>
// Portrait cards (420x780 logical at 2x) for a standing host's side column: flat feet, knees, ligaments.
const PW = 420, S2 = 2;
function pcard(i, kicker) {
  X.save(); X.translate(i * PW * S2, 0); X.scale(S2, S2);
  X.save(); X.shadowColor = "rgba(0,0,0,.35)"; X.shadowBlur = 16; X.shadowOffsetY = 8;
  X.fillStyle = "#fcfcfa"; X.beginPath(); X.roundRect(10, 10, 400, 760, 24); X.fill(); X.restore();
  X.strokeStyle = "#d4d6da"; X.lineWidth = 3; X.beginPath(); X.roundRect(10, 10, 400, 760, 24); X.stroke();
  X.font = "800 19px Mont"; const w = X.measureText(kicker).width;
  X.fillStyle = C.cream; X.beginPath(); X.roundRect(26, 28, w + 28, 38, 7); X.fill();
  X.fillStyle = "#1c1814"; X.textAlign = "left"; X.textBaseline = "middle"; X.fillText(kicker, 40, 48);
  X.font = "13px Cred"; X.fillStyle = C.grey; X.textAlign = "right"; X.fillText("minh hoạ: HPF", 396, 752);
}
const pend = () => X.restore();
window.ready = false;
window.render = function () {
  X.clearRect(0, 0, cv.width, cv.height);
  pcard(0, "BÀN CHÂN BẸT"); pend();                                                        // blank: photos move on it
  pcard(1, "TRỤC GÓT CHÂN (NHÌN TỪ SAU)");
  X.save(); X.translate(115, 110); X.scale(0.86, 0.86); heelBack(0, 0, 0, C.green); X.restore();
  X.save(); X.translate(305, 110); X.scale(0.86, 0.86); heelBack(0, 0, -0.24, C.red); X.restore();
  labelTick("thẳng", 130, 520, C.green, true, 30); labelTick("đổ vào trong", 300, 580, C.red, false, 30); pend();
  pcard(2, "KHỚP GỐI (NHÌN TỪ TRƯỚC)"); leg(78, 140, 1, 0, C.green, 0.56); leg(146, 140, -1, 0, C.green, 0.56);
  leg(270, 140, 1, 1.5, C.red, 0.56); leg(342, 140, -1, 1.5, C.red, 0.56);
  labelTick("thẳng", 128, 470, C.green, true, 30); labelTick("chữ X", 318, 470, C.red, false, 30); pend();
  pcard(3, "DÂY CHẰNG BÊN TRONG GỐI"); kneeFront(225, 150, 0.88, { hot: true });
  hand("dây chằng bên này", 210, 650, C.red, 34); hand("chịu áp lực", 210, 695, C.ink, 30); pend();
  pcard(4, "DÂY CHẰNG QUANH KHỚP GỐI"); kneeInside(215, 150, 0.88);
  hand("ảnh hưởng lâu dài", 210, 650, C.red, 34); hand("dây chằng quanh gối", 210, 695, C.ink, 30); pend();
};
document.fonts.load("700 40px Mont").then(() => document.fonts.load("800 28px Mont")).then(() => document.fonts.ready)
  .catch(() => {}).then(() => { window.render(0); window.ready = true; });
</script></body></html>
