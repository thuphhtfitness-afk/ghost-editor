<title>HPF Reel Fixer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap">
<style>
/* Layout: a work bench. Reel switch and mode switch on top, a column of beat cards (thumbnail left, fields right), a sticky save bar below. */
:root {
  --bg: #F6F2F1; --panel: #FFFFFF; --ink: #1F1517; --mute: #756A6C; --line: #E4DADB;
  --wine: #7A1424; --wine-ink: #FFFFFF; --ok: #1E8A4C; --warn: #B4540A; --soft: #F1E6E7;
  --font-display: "Montserrat", "Inter", system-ui, sans-serif; --font-body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #170E10; --panel: #221619; --ink: #F4ECEC; --mute: #A89A9C; --line: #36262A;
  --wine: #C13A52; --wine-ink: #FFFFFF; --ok: #4CC17F; --warn: #E8913F; --soft: #2C1B1F; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #170E10; --panel: #221619; --ink: #F4ECEC; --mute: #A89A9C; --line: #36262A;
  --wine: #C13A52; --wine-ink: #FFFFFF; --ok: #4CC17F; --warn: #E8913F; --soft: #2C1B1F; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 26px; margin: 0; letter-spacing: -0.5px; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--mute); max-width: 62ch; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { font: 700 14px var(--font-display); padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wine); border-color: var(--wine); color: var(--wine-ink); }
.seg.small button { font: 600 13px var(--font-body); padding: 7px 12px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--wine); outline-offset: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; }
.card.changed { border-color: var(--wine); box-shadow: 0 0 0 1px var(--wine) inset; }
.card.gone { opacity: .55; }
.thumb { position: relative; width: 112px; aspect-ratio: 9/16; border-radius: 8px; overflow: hidden; background: #000; align-self: start; }
.thumb img { width: 100%; height: 100%; display: block; }
.thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.thumb.pick { cursor: crosshair; outline: 2px dashed var(--wine); outline-offset: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.tag { font: 700 11px var(--font-display); letter-spacing: .06em; text-transform: uppercase; background: var(--soft); color: var(--wine); padding: 3px 8px; border-radius: 6px; }
.time { font-variant-numeric: tabular-nums; color: var(--mute); font-size: 13px; }
.fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mute); min-width: 0; }
input[type="text"], input[type="number"], textarea { font: 500 15px var(--font-body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.row > label { flex: 1 1 90px; }
.step { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); }
.step b { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 52px; text-align: center; }
.step button, .ghost { font: 600 13px var(--font-body); border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.ghost.danger[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.cap { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.cap.changed { border-color: var(--wine); }
.cap .time { text-align: right; }
.note { background: var(--soft); border-radius: 10px; padding: 10px 12px; color: var(--mute); font-size: 13px; max-width: 70ch; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); z-index: 20;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 880px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.primary { font: 800 15px var(--font-display); background: var(--wine); color: var(--wine-ink); border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
.primary[disabled] { opacity: .4; cursor: not-allowed; }
#count { font-weight: 600; }
#msg { color: var(--mute); font-size: 13px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 160px; overflow: auto; }
@media (max-width: 520px) { .card { grid-template-columns: 84px minmax(0, 1fr); gap: 10px; } .thumb { width: 84px; } h1 { font-size: 22px; } }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>HPF Reel Fixer</h1>
    <p class="lede">Sửa chữ, thời gian, vị trí vòng tròn và phụ đề của 2 bài HPF mà không cần dựng lại từ đầu. Tải file sửa về, gửi cho tôi một dòng, hoặc chạy lệnh trên máy bạn.</p>
  </header>
  <div class="seg" id="reels" role="group" aria-label="Chọn bài"></div>
  <div class="seg small" id="modes" role="group" aria-label="Chọn phần sửa">
    <button type="button" data-m="beats" aria-pressed="true">Chữ và đồ hoạ</button>
    <button type="button" data-m="caps" aria-pressed="false">Phụ đề</button>
  </div>
  <div id="list" style="display:flex;flex-direction:column;gap:12px"></div>
</div>

<div class="bar"><div class="bar-in">
  <div><div id="count">Chưa có thay đổi</div><div id="msg"></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="ghost" id="copy" type="button">Sao chép nội dung</button>
    <button class="primary" id="save" type="button" disabled>Tải file sửa</button>
  </div>
</div></div>

<script>
const DATA = __DATA__;
const KEYS = Object.keys(DATA);
const LABEL = { label: "Nhãn", title: "Tiêu đề", note: "Ghi chú", guide: "Vòng tròn", glow: "Vùng sáng", anatomy: "Anatomy", hiprot: "Xoay hông", fault: "Dấu lỗi", compare2: "So sánh", broll: "B-roll", punch: "Zoom" };
let reel = KEYS[0], mode = "beats";
const S = { }; KEYS.forEach(k => S[k] = { beats: {}, caps: {} });
try { const j = JSON.parse(localStorage.getItem("hpf-fixer") || "null"); if (j) KEYS.forEach(k => { if (j[k]) S[k] = j[k]; }); } catch (e) {}
const persist = () => { try { localStorage.setItem("hpf-fixer", JSON.stringify(S)); } catch (e) {} };
const $ = (s) => document.querySelector(s);
const mmss = (t) => Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0");
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function changesOf(k) { // the patch for one reel
  const b = {}, p = {};
  for (const [i, c] of Object.entries(S[k].beats)) { if (Object.keys(c).length) b[i] = c; }
  for (const [t, v] of Object.entries(S[k].caps)) { const o = DATA[k].caps.find(x => String(x.t) === t); if (o && v.trim() && v.trim() !== o.text) p[o.text] = v.trim(); }
  return { reel: k, beats: b, phrases: p };
}
const nChanges = (k) => { const c = changesOf(k); return Object.keys(c.beats).length + Object.keys(c.phrases).length; };

function drawReels() {
  $("#reels").innerHTML = KEYS.map(k => `<button type="button" data-k="${k}" aria-pressed="${k === reel}">${esc(DATA[k].title)}${nChanges(k) ? " · " + nChanges(k) : ""}</button>`).join("");
}
function overlay(b, c) {
  const f = Object.assign({}, b.f, c); let s = "";
  if (b.type === "guide" && f.cx != null) s = `<circle cx="${f.cx}" cy="${f.cy}" r="${f.r}" fill="none" stroke="#FF3B2F" stroke-width="14"/>`;
  if (b.type === "glow" && f.cx != null) s = `<ellipse cx="${f.cx}" cy="${f.cy}" rx="${f.rx}" ry="${f.ry}" fill="rgba(255,60,40,.3)" stroke="#FF5A3C" stroke-width="10" stroke-dasharray="26 18"/>`;
  return s ? `<svg viewBox="0 0 1080 1920" aria-hidden="true">${s}</svg>` : "";
}
const FIELD = { text: "Chữ", tag: "Dòng nhỏ", big: "Chữ lớn đỏ", sub: "Dòng đen", title: "Tiêu đề", a_title: "Tiêu đề lúc xoay ngoài", b_title: "Tiêu đề lúc xoay trong", top_label: "Nhãn nửa trên", bottom_label: "Nhãn nửa dưới" };
function beatCard(b) {
  const c = S[reel].beats[b.i] || {}, f = Object.assign({}, b.f, c), changed = Object.keys(c).length > 0;
  const textKeys = Object.keys(b.f).filter(k => k in FIELD);
  const pos = ("cx" in b.f) ? `<div class="row">${["cx", "cy"].concat(b.type === "glow" ? ["rx", "ry"] : ["r"]).map(k => `<label>${{ cx: "Ngang", cy: "Dọc", r: "Bán kính", rx: "Rộng", ry: "Cao" }[k]}<input type="number" data-i="${b.i}" data-f="${k}" value="${f[k]}" step="10"></label>`).join("")}</div><button type="button" class="ghost" data-pick="${b.i}">Bấm lên hình để đặt tâm</button>` : "";
  const ysel = b.type === "fault" ? `<label>Vị trí dọc dấu X<input type="number" data-i="${b.i}" data-f="y" value="${f.y}" step="20"></label>` : "";
  const shift = c.shift || 0, dur = c.dur || 0;
  return `<article class="card${changed ? " changed" : ""}${c.delete ? " gone" : ""}" id="b${b.i}">
    <div class="thumb" data-t="${b.i}"><img src="${b.img}" alt="Khung hình lúc ${mmss(b.t0)}">${overlay(b, c)}</div>
    <div class="fields">
      <div class="meta"><span class="tag">${LABEL[b.type] || b.type}</span><span class="time">${mmss(b.t0)} → ${mmss(b.t1)}</span></div>
      ${textKeys.map(k => `<label>${FIELD[k]}<input type="text" data-i="${b.i}" data-f="${k}" value="${esc(f[k])}"></label>`).join("")}${pos}${ysel}
      <div class="actions">
        <div class="step" aria-label="Dịch thời điểm">Dời <button type="button" data-s="${b.i}" data-d="-0.2" aria-label="Sớm hơn 0,2 giây">−0,2</button><b>${shift > 0 ? "+" : ""}${shift.toFixed(1)}s</b><button type="button" data-s="${b.i}" data-d="0.2" aria-label="Muộn hơn 0,2 giây">+0,2</button></div>
        <div class="step">Kéo dài <button type="button" data-u="${b.i}" data-d="-0.3" aria-label="Ngắn hơn 0,3 giây">−0,3</button><b>${dur > 0 ? "+" : ""}${dur.toFixed(1)}s</b><button type="button" data-u="${b.i}" data-d="0.3" aria-label="Dài hơn 0,3 giây">+0,3</button></div>
        <button type="button" class="ghost danger" data-x="${b.i}" aria-pressed="${!!c.delete}">${c.delete ? "Sẽ bỏ cảnh này" : "Bỏ cảnh này"}</button>
        ${changed ? `<button type="button" class="ghost" data-r="${b.i}">Hoàn tác</button>` : ""}
      </div>
    </div></article>`;
}
function capRow(c) {
  const v = S[reel].caps[c.t], ch = v != null && v.trim() !== c.text;
  return `<div class="cap${ch ? " changed" : ""}"><span class="time">${mmss(c.t)}</span><input type="text" data-c="${c.t}" value="${esc(v != null ? v : c.text)}" aria-label="Phụ đề lúc ${mmss(c.t)}"></div>`;
}
function draw() {
  drawReels();
  document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === mode));
  const d = DATA[reel];
  $("#list").innerHTML = mode === "beats"
    ? d.beats.map(beatCard).join("")
    : `<div class="note">Sửa chữ nào sai thì gõ lại ngay trong ô. Hệ thống lưu thành một quy tắc "chữ sai → chữ đúng" và áp dụng cho mọi chỗ có cụm đó. Chỉ sửa chữ, không đổi thời gian.</div>` + d.caps.map(capRow).join("");
  const n = nChanges(reel);
  $("#count").textContent = n ? `${n} thay đổi ở ${DATA[reel].title.split(" · ")[0]}` : "Chưa có thay đổi";
  $("#save").disabled = !n; $("#save").textContent = "Tải file sửa " + DATA[reel].title.split(" · ")[0];
}
function setBeat(i, fn) { const c = S[reel].beats[i] || (S[reel].beats[i] = {}); fn(c); if (!Object.keys(c).length) delete S[reel].beats[i]; persist(); }
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, .thumb"); if (!t) return;
  if (t.dataset.k) { reel = t.dataset.k; draw(); return; }
  if (t.dataset.m) { mode = t.dataset.m; draw(); return; }
  if (t.dataset.s) { setBeat(t.dataset.s, c => { c.shift = Math.round(((c.shift || 0) + +t.dataset.d) * 10) / 10; if (!c.shift) delete c.shift; }); keepScroll(draw); }
  else if (t.dataset.u) { setBeat(t.dataset.u, c => { c.dur = Math.round(((c.dur || 0) + +t.dataset.d) * 10) / 10; if (!c.dur) delete c.dur; }); keepScroll(draw); }
  else if (t.dataset.x) { setBeat(t.dataset.x, c => { if (c.delete) delete c.delete; else c.delete = true; }); keepScroll(draw); }
  else if (t.dataset.r) { delete S[reel].beats[t.dataset.r]; persist(); keepScroll(draw); }
  else if (t.dataset.pick) { const th = document.querySelector(`.thumb[data-t="${t.dataset.pick}"]`); document.querySelectorAll(".thumb.pick").forEach(x => x.classList.remove("pick")); th.classList.add("pick"); }
  else if (t.classList.contains("thumb") && t.classList.contains("pick")) {
    const r = t.getBoundingClientRect(), i = t.dataset.t, x = Math.round((e.clientX - r.left) / r.width * 1080), y = Math.round((e.clientY - r.top) / r.height * 1920);
    setBeat(i, c => { c.cx = x; c.cy = y; }); keepScroll(draw);
  }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.c != null) { S[reel].caps[el.dataset.c] = el.value; persist(); el.closest(".cap").classList.toggle("changed", el.value.trim() !== DATA[reel].caps.find(x => String(x.t) === el.dataset.c).text); updateBar(); return; }
  if (el.dataset.f) {
    const i = el.dataset.i, k = el.dataset.f, b = DATA[reel].beats.find(x => String(x.i) === i), v = el.type === "number" ? +el.value : el.value;
    setBeat(i, c => { if (String(v) === String(b.f[k])) delete c[k]; else c[k] = v; });
    const card = el.closest(".card"); card.classList.toggle("changed", !!S[reel].beats[i]);
    const th = card.querySelector(".thumb svg"); if (th) th.remove(); const o = overlay(b, S[reel].beats[i] || {}); if (o) card.querySelector(".thumb").insertAdjacentHTML("beforeend", o);
    updateBar();
  }
});
function updateBar() { const n = nChanges(reel); $("#count").textContent = n ? `${n} thay đổi ở ${DATA[reel].title.split(" · ")[0]}` : "Chưa có thay đổi"; $("#save").disabled = !n; drawReels(); }

async function payload() { return JSON.stringify(changesOf(reel), null, 1); }
$("#save").addEventListener("click", async () => {
  const msg = $("#msg"); msg.textContent = "";
  try {
    const dl = await claude.use("downloads");
    if (!dl) { msg.textContent = "Trình xem này không tải được file. Bấm Sao chép nội dung rồi gửi cho tôi."; return; }
    await dl.save({ filename: `hpf_${reel}_patch.json`, data: await payload() });
    msg.textContent = `Đã lưu hpf_${reel}_patch.json. Gửi file cho tôi, tôi áp dụng và dựng lại.`;
  } catch (err) { msg.textContent = err && err.code === "declined" ? "Bạn đã huỷ lưu file." : "Không lưu được file. Dùng nút Sao chép nội dung."; }
});
$("#copy").addEventListener("click", async () => {
  const msg = $("#msg"), text = await payload();
  try { await navigator.clipboard.writeText(text); msg.textContent = "Đã sao chép. Dán vào chat để gửi cho tôi."; }
  catch (e) { msg.innerHTML = "Chọn và sao chép đoạn dưới:"; msg.insertAdjacentHTML("beforeend", `<pre>${esc(text)}</pre>`); }
});
draw();
</script>
